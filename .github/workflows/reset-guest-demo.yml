name: Reset Guest Demo Data

on:
  schedule:
    - cron: '0 18 * * *'  # 매일 UTC 18:00 (KST 새벽 3시)
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Call reset_guest_demo_data RPC
        run: |
          curl -f -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/reset_guest_demo_data" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{}"
