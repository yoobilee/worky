name: Patch Announcement

on:
  push:
    tags:
      - 'v*'

jobs:
  announce:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse PATCH_NOTES and create announcement
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # 태그명 추출 (예: v1.1.2)
          TAG=${GITHUB_REF#refs/tags/}

          # PATCH_NOTES.md에 해당 버전 섹션이 없으면(기술적 릴리스라 사용자
          # 공지가 필요 없는 경우 등) announcement 생성을 조용히 건너뛴다
          if ! grep -q "^## \[${TAG}\]" PATCH_NOTES.md 2>/dev/null; then
            echo "PATCH_NOTES.md에 ${TAG} 섹션이 없어 사용자 공지를 건너뜁니다."
            exit 0
          fi

          # PATCH_NOTES.md에서 해당 버전 내용 파싱 (사용자 체감 변경사항만,
          # CHANGELOG.md의 개발자용 전체 이력과 별도)
          # ## [v1.1.2] 섹션부터 다음 ## 섹션 전까지 추출
          CONTENT=$(awk "/^## \[${TAG}\]/{found=1; next} found && /^## /{exit} found{print}" PATCH_NOTES.md | sed '/^$/d' | sed 's/### //g' | sed 's/\*\*//g' | sed 's/^- /• /g')

          TITLE="${TAG} 업데이트"

          # jq로 안전하게 JSON 생성 (따옴표, 백슬래시 등 특수문자 자동 이스케이프)
          PAYLOAD=$(jq -n --arg title "$TITLE" --arg content "$CONTENT" \
            '{title: $title, content: $content, type: "patch", is_active: true}')

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${SUPABASE_URL}/rest/v1/announcements" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "$PAYLOAD")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Announcement 생성 실패 (HTTP $HTTP_CODE): $BODY"
            exit 1
          fi

          echo "Announcement created for ${TAG}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          RELEASE_NOTES=$(awk "/^## \[${TAG}\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md | sed '/^$/d')
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes "$RELEASE_NOTES" \
            --repo "${{ github.repository }}" || echo "Release may already exist, skipping"
