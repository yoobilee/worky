name: Claude Review Response
on:
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created, edited]

# pull_request_review_comment(인라인 코드 리뷰 코멘트)를 추가한 이유: Codex의
# 실제 P1/P2 지적사항은 거의 항상 파일/라인에 달리는 "인라인" 코멘트로
# 오는데, 이 이벤트는 pull_request_review(리뷰 제출 자체)와 완전히 별개의
# 웹훅 이벤트다. 게다가 pull_request_review의 review.body에는 인라인
# 코멘트 내용이 전혀 포함되지 않고 "Codex Review / Reviewed commit" 같은
# 껍데기 안내문만 있어, 지금까지 이 파이프라인이 Codex의 실제 지적사항을
# 한 번도 제대로 못 읽고 있었다(실측 확인됨). 아래 "PR 정보 조회" 스텝에서
# 이벤트 종류와 무관하게 항상 그 리뷰(MARKER_ID)에 딸린 인라인 코멘트
# 전체를 조회해 합친다 - pull_request_review와 pull_request_review_comment
# (인라인 코멘트 개수만큼) 여러 건이 같은 리뷰 제출에서 거의 동시에
# 트리거되는데, 어느 쪽이 먼저 "GitHub Issue 자동 등록"에 도달해 마커를
# 선점하든 항상 완전한 집계 내용을 다시 조회하므로 부분 정보로 이슈가
# 고정되는 race condition이 없다(Codex 지적, Issue #61 - 상세 이유는
# 아래 "PR 정보 조회" 스텝의 INLINE_COMMENTS 조회 부분 주석 참고).

# 신뢰하는 리뷰 봇의 GitHub 로그인(actor).
# TODO(확인 필요): chatgpt-codex-connector[bot]은 GitHub App bot login 네이밍
# 관례(<app-slug>[bot])에 따른 추정값입니다. 실제 테스트 PR에서 발생하는
# pull_request_review.review.user.login / issue_comment.comment.user.login
# 값을 확인해 정확한 값으로 교체하세요. 이 값 하나만 바꾸면 워크플로우
# 전체가 새 리뷰 봇을 인식합니다.
# (review-timeout-watchdog.yml에도 동일한 값이 있으니 함께 갱신할 것)
env:
  REVIEW_BOT_LOGIN: chatgpt-codex-connector[bot]

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  respond:
    # 정확한 봇 계정 비교는 env 컨텍스트를 참조할 수 없는 job 레벨 if에서는
    # 할 수 없으므로(env는 step에서만 사용 가능), 여기서는 "봇 계정인지"만
    # 걸러 불필요한 runner 기동을 줄이고, 정확한 REVIEW_BOT_LOGIN 비교는
    # 아래 "PR 정보 조회" 스텝에서 fail-closed로 한 번 더 수행한다
    # (steps.pr.outputs.is_trusted_bot으로 이후 모든 스텝을 게이팅).
    if: >
      (github.event_name == 'pull_request_review' &&
       endsWith(github.event.review.user.login, '[bot]') &&
       github.event.pull_request.head.repo.full_name != '' &&
       github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name) ||
      (github.event_name == 'pull_request_review_comment' &&
       endsWith(github.event.comment.user.login, '[bot]') &&
       github.event.pull_request.head.repo.full_name != '' &&
       github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name) ||
      (github.event_name == 'issue_comment' &&
       endsWith(github.event.comment.user.login, '[bot]') &&
       github.event.issue.pull_request)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: PR 정보 조회
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER_REVIEW: ${{ github.event.pull_request.number }}
          PR_REF_REVIEW: ${{ github.event.pull_request.head.ref }}
          PR_URL_REVIEW: ${{ github.event.pull_request.html_url }}
          PR_TITLE_REVIEW: ${{ github.event.pull_request.title }}
          PR_HEAD_REPO_REVIEW: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_REPO_REVIEW: ${{ github.event.pull_request.base.repo.full_name }}
          PR_REVIEW_BODY: ${{ github.event.review.body }}
          PR_REVIEW_ACTOR: ${{ github.event.review.user.login }}
          PR_REVIEW_ID: ${{ github.event.review.id }}
          # 아래 COMMENT_* 4개는 issue_comment(일반 코멘트)와
          # pull_request_review_comment(인라인 코멘트) 두 이벤트 모두
          # 동일하게 github.event.comment.*에서 오므로 하나로 공유해서 쓴다.
          # RC_REVIEW_ID/COMMENT_PATH/COMMENT_LINE은 인라인 코멘트에만
          # 있는 필드라 issue_comment에서는 항상 빈 값이 된다.
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ACTOR: ${{ github.event.comment.user.login }}
          COMMENT_ID: ${{ github.event.comment.id }}
          RC_REVIEW_ID: ${{ github.event.comment.pull_request_review_id }}
          RC_COMMENT_PATH: ${{ github.event.comment.path }}
          RC_COMMENT_LINE: ${{ github.event.comment.line }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          if [ "$EVENT_NAME" = "pull_request_review" ]; then
            NUMBER="$PR_NUMBER_REVIEW"
            REF="$PR_REF_REVIEW"
            URL="$PR_URL_REVIEW"
            TITLE="$PR_TITLE_REVIEW"
            BODY="$PR_REVIEW_BODY"
            ACTOR="$PR_REVIEW_ACTOR"
            MARKER_ID="$PR_REVIEW_ID"
            # fail-closed: 두 값이 모두 비어있어 우연히 같아지는 경우까지
            # "포크 아님"으로 통과시키지 않도록 head 값의 비어있음 여부도 확인
            if [ -n "$PR_HEAD_REPO_REVIEW" ] && [ "$PR_HEAD_REPO_REVIEW" = "$PR_BASE_REPO_REVIEW" ]; then
              IS_FORK="false"
            else
              IS_FORK="true"
            fi
          elif [ "$EVENT_NAME" = "pull_request_review_comment" ]; then
            NUMBER="$PR_NUMBER_REVIEW"
            REF="$PR_REF_REVIEW"
            URL="$PR_URL_REVIEW"
            TITLE="$PR_TITLE_REVIEW"
            BODY="$COMMENT_BODY"
            ACTOR="$COMMENT_ACTOR"
            # 인라인 코멘트는 항상 어떤 리뷰(pending 리뷰 포함)에 속해있어
            # pull_request_review_id가 채워져 있다 - 같은 리뷰에 딸린 다른
            # 인라인 코멘트/리뷰 제출 이벤트와 마커를 공유해 중복 등록·중복
            # 알림을 막는다 (아래 5번, "GitHub Issue 자동 등록"/"특이사항
            # 알림" 참고)
            MARKER_ID="$RC_REVIEW_ID"
            if [ -n "$PR_HEAD_REPO_REVIEW" ] && [ "$PR_HEAD_REPO_REVIEW" = "$PR_BASE_REPO_REVIEW" ]; then
              IS_FORK="false"
            else
              IS_FORK="true"
            fi
          else
            NUMBER="$ISSUE_NUMBER"
            REF=$(gh pr view "$NUMBER" --repo "$REPO" --json headRefName -q .headRefName)
            URL="$ISSUE_URL"
            TITLE="$ISSUE_TITLE"
            BODY="$COMMENT_BODY"
            ACTOR="$COMMENT_ACTOR"
            MARKER_ID="$COMMENT_ID"
            IS_FORK=$(gh pr view "$NUMBER" --repo "$REPO" --json isCrossRepository -q .isCrossRepository)
          fi

          # job 레벨 if는 "*[bot]" 여부만 걸렀으므로, 실제로 우리가 신뢰하는
          # 리뷰 봇(REVIEW_BOT_LOGIN)이 맞는지 여기서 정확히 재확인한다.
          # 이 결과로 이후 모든 스텝을 게이팅해 다른 봇(vercel[bot] 등)의
          # 코멘트가 리뷰로 오인되지 않도록 한다.
          if [ "$ACTOR" = "$REVIEW_BOT_LOGIN" ]; then
            IS_TRUSTED_BOT="true"
          else
            IS_TRUSTED_BOT="false"
          fi

          # 리뷰 봇이 아직 리뷰를 마치지 못한 "처리 중" placeholder 코멘트/리뷰는
          # 실제 리뷰 내용이 없으므로 이후 스텝을 전부 건너뛴다 (나중에 코멘트가
          # 실제 리뷰 내용으로 수정되면 그때 다시 트리거됨)
          case "$BODY" in
            *"Currently processing new changes"*) IS_PLACEHOLDER="true" ;;
            *) IS_PLACEHOLDER="false" ;;
          esac

          # 리뷰 봇이 "리뷰를 아예 실행하지 않았다/스킵했다"는 취지의 안내만
          # 남긴 경우를 감지한다. placeholder와 달리 이 경우는 실제 코드
          # 검증이 다시 이뤄질 거란 보장이 없으므로 "문제없음"이 아니라 반드시
          # 사람 확인이 필요한 상태로 처리해야 한다. (CodeRabbit이 "이
          # 저장소는 star 10개 미만이라 리뷰를 안 한다"는 스킵 안내를
          # "지적사항 없음"으로 오인해 PR #49가 검증 없이 자동 merge된 사고의
          # 재발 방지 - 아래 "실제 git 상태 검증" 스텝에서 needs_human=true로
          # 강제 처리됨)
          BODY_LOWER=$(printf '%s' "$BODY" | tr '[:upper:]' '[:lower:]')
          case "$BODY_LOWER" in
            *"does not receive"*|*"skip review"*|*"skipped"*|*"rate limit"*|*"rate-limited"*) IS_REVIEW_SKIPPED="true" ;;
            *) IS_REVIEW_SKIPPED="false" ;;
          esac

          # pull_request_review 이벤트의 review.body에는 인라인 코드 리뷰
          # 코멘트 내용이 전혀 포함되지 않는다(Codex의 실제 P1/P2 지적사항은
          # 거의 항상 인라인 코멘트로 옴 - 실측 확인됨). 이 리뷰(MARKER_ID)에
          # 딸린 인라인 코멘트들을 별도로 조회해 프롬프트용 콘텐츠에 합친다.
          #
          # pull_request_review_comment 이벤트에서도 (자신이 들고 온 코멘트
          # 하나만 쓰지 않고) 동일하게 이 조회를 수행한다 - 그렇지 않으면
          # race condition이 있었다: 같은 리뷰 제출 1건이 pull_request_review
          # 1건 + 인라인 코멘트 개수만큼의 pull_request_review_comment로
          # 나뉘어 거의 동시에 트리거되는데, 만약 단일 코멘트 이벤트가 먼저
          # "GitHub Issue 자동 등록"에 도달해 그 코멘트 하나만으로 이슈를
          # 먼저 만들어버리면, 뒤이어 도착하는(전체 코멘트를 집계해서 보는)
          # pull_request_review 실행은 마커가 이미 선점된 것을 보고 그
          # 불완전한 이슈를 그대로 재사용만 할 뿐 나머지 지적사항을 채워
          # 넣지 않아, 같은 리뷰의 다른 지적사항들이 영영 기록되지 않는
          # 문제가 있었다(Codex 지적, Issue #61 1번). 리뷰 제출 시 딸린
          # 인라인 코멘트들은 리뷰와 원자적으로 함께 생성되므로, 어느
          # 이벤트가 먼저 오든 이 시점에 API를 조회하면 이미 그 리뷰의
          # 전체 코멘트를 볼 수 있다 - "먼저 도착한 이벤트가 부분 정보로
          # 마커를 선점"하는 문제를, 대기/병합 로직 없이 "이벤트 종류와
          # 무관하게 항상 완전한 집계 내용을 다시 조회"하는 방식으로
          # 근본 해결한다.
          #
          # 이 리뷰가 신뢰 봇의 것이 아니거나(is_trusted_bot=false) 조회
          # 자체가 실패해도 조용히 빈 값으로 두고 계속 진행한다 - 이 경우
          # reviewContentRead는 프롬프트 지침에 따라 false로 판단되어
          # fail-closed로 처리된다.
          #
          # --paginate: 페이지네이션 없이는 코멘트 이력이 많은 PR에서
          # REST API 첫 페이지(기본 30개)를 넘는 코멘트가 응답에서 누락돼
          # 이 리뷰(MARKER_ID)에 딸린 코멘트가 필터링 결과에서 비게 될 수
          # 있었다(Codex 지적, Issue #61 2번). gh api --paginate는 모든
          # 페이지를 이어붙인 전체 배열을 반환한다.
          INLINE_COMMENTS=""
          if { [ "$EVENT_NAME" = "pull_request_review" ] || [ "$EVENT_NAME" = "pull_request_review_comment" ]; } \
             && [ "$ACTOR" = "$REVIEW_BOT_LOGIN" ] && [ -n "$MARKER_ID" ]; then
            ALL_COMMENTS_JSON=$(gh api --paginate "repos/$REPO/pulls/$NUMBER/comments" 2>/dev/null || echo "[]")
            INLINE_COMMENTS=$(echo "$ALL_COMMENTS_JSON" | jq -r --arg review_id "$MARKER_ID" \
              '[.[] | select((.pull_request_review_id // 0 | tostring) == $review_id)]
               | map("- [" + .path + (if .line then (":" + (.line | tostring)) else "" end) + "]\n" + .body)
               | join("\n\n")' 2>/dev/null || echo "")
          fi

          if [ "$EVENT_NAME" = "pull_request_review" ]; then
            if [ -n "$INLINE_COMMENTS" ]; then
              REVIEW_CONTENT=$(printf '[리뷰 요약]\n%s\n\n[인라인 코드 리뷰 코멘트 목록]\n%s' "$BODY" "$INLINE_COMMENTS")
            else
              REVIEW_CONTENT="$BODY"
            fi
          elif [ "$EVENT_NAME" = "pull_request_review_comment" ]; then
            if [ -n "$INLINE_COMMENTS" ]; then
              # 이 코멘트 하나만이 아니라, 같은 리뷰(MARKER_ID)에 딸린
              # 인라인 코멘트 전체를 집계한 결과 - pull_request_review가
              # 먼저 도착했든 나중에 도착했든 항상 동일한 완전한 내용으로
              # 수렴한다.
              REVIEW_CONTENT=$(printf '[인라인 코드 리뷰 코멘트 목록 - 이 코멘트가 속한 리뷰 전체]\n%s' "$INLINE_COMMENTS")
            else
              # 집계 조회가 실패했거나 결과가 비었을 때의 폴백 - 최소한 이
              # 이벤트가 들고 온 코멘트 하나는 놓치지 않는다.
              LINE_LABEL="${RC_COMMENT_LINE:-?}"
              REVIEW_CONTENT=$(printf '[인라인 코드 리뷰 코멘트 - %s:%s]\n%s' "$RC_COMMENT_PATH" "$LINE_LABEL" "$BODY")
            fi
          else
            REVIEW_CONTENT="$BODY"
          fi

          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "is_fork=$IS_FORK" >> "$GITHUB_OUTPUT"
          echo "is_trusted_bot=$IS_TRUSTED_BOT" >> "$GITHUB_OUTPUT"
          echo "is_placeholder=$IS_PLACEHOLDER" >> "$GITHUB_OUTPUT"
          echo "is_review_skipped=$IS_REVIEW_SKIPPED" >> "$GITHUB_OUTPUT"
          echo "review_marker_id=$MARKER_ID" >> "$GITHUB_OUTPUT"
          delimiter_rc=$(openssl rand -hex 8)
          {
            echo "review_content_for_prompt<<$delimiter_rc"
            echo "$REVIEW_CONTENT"
            echo "$delimiter_rc"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.pr.outputs.is_trusted_bot == 'true' && steps.pr.outputs.is_fork == 'false' && steps.pr.outputs.is_placeholder == 'false' && steps.pr.outputs.is_review_skipped == 'false'
        with:
          ref: ${{ steps.pr.outputs.ref }}
          persist-credentials: false

      - name: Claude Code 리뷰 처리
        id: claude
        if: steps.pr.outputs.is_trusted_bot == 'true' && steps.pr.outputs.is_fork == 'false' && steps.pr.outputs.is_placeholder == 'false' && steps.pr.outputs.is_review_skipped == 'false'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        # --allowedTools의 gh 관련 항목은 리뷰 봇의 실제 리뷰/인라인 코멘트를
        # 읽어오기 위한 읽기 전용 조회 명령만 허용한다(gh pr view, gh pr diff,
        # gh issue list, gh api). gh pr merge/close, gh issue create, gh repo
        # delete처럼 상태를 바꾸는 명령은 절대 포함하지 않는다 - 그런 작업은
        # 이미 이 워크플로우의 "GitHub Issue 자동 등록", "자동 merge 요청" 등
        # 별도 스텝에서 더 좁은 조건(fail-closed 검증 통과 후) 하에 전용
        # gh 호출로만 수행되므로, 에이전트의 자유 판단에 맡기면 안 된다.
        # 참고: Bash(gh api:*) 패턴 자체는 -X POST/PATCH/DELETE까지 문자열
        # 매칭상 허용되어 GET으로 제한하지는 못한다(패턴 문법상 HTTP 메서드
        # 구분 불가) - 다만 이미 git push까지 허용된 에이전트이므로 이 잔여
        # 위험은 기존 신뢰 수준보다 크지 않다고 판단했다. 프롬프트에서도
        # 조회 목적으로만 쓰도록 지시한다.
        #
        # --max-turns를 20에서 35로 올렸다: 위 gh 조회 권한 추가 이후 PR #56
        # 재리뷰 사이클에서 error_max_turns(21턴에서 강제 종료)가 실제로 두
        # 차례 발생했는데, 실행 로그의 permission_denials_count가 각각
        # 10/21, 12/21로 턴의 절반 가까이가 "허용 목록 밖 도구(Read/Grep 등
        # 파일 직접 열람, 또는 목록에 없는 gh 하위 명령) 시도 -> 거부"에
        # 소모되고 있었다. 근본 해결은 허용 도구 범위를 다시 검토하는 쪽에
        # 가깝지만(이번 변경 범위 밖이라 보류), 우선 턴 예산을 늘려 거부가
        # 몇 번 나더라도 정상적으로 결론을 낼 여유를 준다. GitHub Actions
        # 잡/타임아웃 제약은 없고(이 워크플로우와 저장소의 다른 워크플로우
        # 모두 timeout-minutes 미설정, 기본 360분), 21턴에 176초·$0.47이
        # 소요된 것을 기준으로 35턴이어도 시간/비용 모두 여유 있는 수준이라
        # 판단했다.
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GH_PAT }}
          allowed_bots: ${{ env.REVIEW_BOT_LOGIN }}
          claude_args: |
            --max-turns 35
            --allowedTools "Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git diff:*),Bash(git status:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue list:*),Bash(gh api:*)"
            --json-schema '{"type":"object","properties":{"hasIssues":{"type":"boolean"},"fixed":{"type":"boolean"},"needsHuman":{"type":"boolean"},"reviewContentRead":{"type":"boolean"},"issueSummary":{"type":"string"},"humanReviewReason":{"type":"string"},"causeExplanation":{"type":"string"},"fixExplanation":{"type":"string"}},"required":["hasIssues","fixed","needsHuman","reviewContentRead","issueSummary","humanReviewReason","causeExplanation","fixExplanation"]}'
          prompt: |
            이 PR에 리뷰 봇(Codex)이 남긴 리뷰/코멘트를 확인해줘:
            ${{ steps.pr.outputs.review_content_for_prompt }}

            (참고: 위 콘텐츠는 이벤트 종류에 따라 형태가 달라. "[리뷰 요약]"과
            "[인라인 코드 리뷰 코멘트 목록]" 두 섹션이 같이 있으면 리뷰
            제출(pull_request_review)에 딸린 실제 지적사항들이 이미 합쳐져
            있는 것이니 그대로 판단하면 돼. "[인라인 코드 리뷰 코멘트 목록 -
            이 코멘트가 속한 리뷰 전체]" 형태면 인라인 코멘트(pull_request_
            review_comment) 단독 트리거지만 같은 리뷰에 딸린 코멘트 전체를
            이미 집계해서 보여주는 것이니 마찬가지로 그대로 판단하면 돼.
            "[인라인 코드 리뷰 코멘트 - 파일:라인]" 형태로 코멘트 딱 하나만
            있으면, 집계 조회 자체가 실패한 예외적인 경우라 이 코멘트
            하나의 내용만으로 판단해 - 어느 형태든 굳이 다른 코멘트를
            추가로 찾아볼 필요 없어.)

            (참고: pull_request_review 이벤트라면 리뷰 상태는
            "${{ github.event.review.state }}"야 - 리뷰 요약이 비어있거나
            안내 문구만 있어도 이 상태값이 APPROVED/COMMENTED인지가 판단에
            도움이 될 수 있어.)

            (참고: 사용 가능한 도구는 git 하위 명령 몇 개와 gh pr view,
            gh pr diff, gh issue list, gh api뿐이야. 이 목록에 없는 도구나
            명령(예: 파일을 직접 여는 다른 방식, 목록에 없는 gh 하위 명령)을
            시도했다가 거부당하면, 같은 걸 형태만 바꿔 반복 시도하지 말고
            즉시 포기하고 허용된 도구로 대체하거나 정보 없이 판단해 - 거부된
            시도를 반복하다 턴 예산을 다 쓰면 결과를 아예 못 내고 실패
            처리되니, 반복보다는 "이 정보는 확인 못 함"을 인정하고 넘어가는
            게 나아. 같은 정보를 이미 조회했다면 다시 조회하지 말고 그
            결과를 재사용해.)

            아래 원칙에 따라 처리해:
            1. reviewContentRead 필드: 위 리뷰 본문(그리고 필요해서 gh CLI 등으로
               추가 조회를 시도했다면 그 결과까지 포함)을 실제로 확인해서 지적사항
               여부를 판단할 근거가 충분하면 true로 표시해. 특히 본문이 비어있거나
               "Reviewed commit: ..." 같은 안내 문구만 있고 실제 지적 내용이
               안 보이면, 곧바로 false로 단정하지 말고 먼저 gh CLI(허용된
               조회 명령: gh pr view, gh pr diff, gh issue list, gh api)로
               이 PR의 실제 리뷰/인라인 코멘트나 리액션(👍 등)을 조회해서
               확인해봐 - Codex는 지적할 게 없으면 본문 없이 👍 리액션만
               남기는 경우가 있어. 그렇게 조회해서 "정말 지적사항이 없다"는
               근거를 얻었으면 reviewContentRead:true로 표시해도 돼. gh CLI,
               네트워크 접근 등 도구 호출이 차단/실패해서 끝내 확인하지
               못했다면 - 조금이라도 확신이 안 서면 - 반드시 false로 표시해.
               이 필드는 "확인 불가"와 "확인했더니 문제없음이 확실한 경우"를
               구분하는 안전장치이므로 애매하면 무조건 false야.
            2. 리뷰 내용이 "이 저장소는 리뷰를 실행하지 않았다/스킵했다/
               레이트리밋에 걸렸다" 같이 실제 코드를 검토하지 않았다는
               취지라면, 이를 절대 "문제없음"으로 해석하지 마. 이 경우
               hasIssues는 false로 두되 needsHuman은 반드시 true로,
               humanReviewReason에는 "리뷰가 실제로 수행되지 않음"이라는
               취지를 명확히 적어.
            3. 리뷰 봇이 실제로 코드를 검토했고 지적한 문제가 없으면
               (승인/문제없음) 그대로 종료. 단 이 경로로 hasIssues:false,
               needsHuman:false를 낼 때는 reviewContentRead가 true인 경우에만
               해당돼 - 리뷰를 제대로 못 읽었으면 절대 이 경로를 쓰지 마.
            4. 안전하고 확실하게 고칠 수 있는 문제(타입 에러, 명백한 버그,
               스타일 문제 등)면 직접 코드를 수정하고 커밋해
            5. 아래에 해당하면 절대 코드를 수정하지 말고 "사람 판단 필요"로만 분류:
               - Supabase 마이그레이션 파일(supabase/migrations/) 관련 지적
               - 환경변수, API 키, 인증/보안 관련 지적
               - GitHub Actions 워크플로우 파일(.github/workflows/) 자체 관련 지적
               - 여러 가지 해석이 가능하거나 설계 판단이 필요한 지적
            6. 코드를 직접 수정한 경우, 반드시 git add, git commit, git push까지
               완료해서 이 브랜치에 반영해. 커밋 메시지는 한국어로 변경 내용을 요약해.
            7. 마지막에 지정된 JSON 스키마(hasIssues, fixed, needsHuman,
               reviewContentRead, issueSummary, humanReviewReason,
               causeExplanation, fixExplanation 8개 필드 모두 필수)를 정확히
               지켜서 결과를 출력해. issueSummary에는 어떤 결함을 발견했고
               고쳤는지 여부만 사실 위주로 작성하고, humanReviewReason에는
               왜 사람이 직접 판단해야 하는지 이유를 작성해 (사람 판단이
               필요 없으면 빈 문자열로 둬). causeExplanation에는 GitHub
               Issue 등록에 쓸 것이므로, 문제가 된 코드 스니펫(마크다운 코드
               블록)과 함께 왜 문제인지 원인을 한국어로 설명해 작성해
               (hasIssues:false면 빈 문자열로 둬). fixExplanation에는
               실제로 무엇을, 어떻게 고쳤는지 수정 후 코드 스니펫과 함께
               한국어로 작성해 - 반드시 fixed:true일 때만 채우고,
               fixed:false면 빈 문자열로 둬(고치지 않았는데 고친 것처럼
               쓰면 안 됨).

      - name: 결과 파싱 및 분기
        id: parse
        if: always() && steps.pr.outputs.is_trusted_bot == 'true' && steps.pr.outputs.is_fork == 'false' && steps.pr.outputs.is_placeholder == 'false' && steps.pr.outputs.is_review_skipped == 'false'
        env:
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
        run: |
          # fail-closed 기본값: 아래 로직 도중 예기치 않게(jq 실패 등) 죽어도
          # trap이 이 안전한 값을 그대로 출력한다
          NEEDS_HUMAN=true
          HAS_ISSUES=true
          ISSUE_SUMMARY=""
          HUMAN_REVIEW_REASON="파싱 스크립트가 완료되지 못함 - 확인 필요"
          CAUSE_EXPLANATION=""
          FIX_EXPLANATION=""

          write_result() {
            echo "needs_human=$NEEDS_HUMAN" >> "$GITHUB_OUTPUT"
            echo "has_issues=$HAS_ISSUES" >> "$GITHUB_OUTPUT"
            delimiter1=$(openssl rand -hex 8)
            {
              echo "issue_summary<<$delimiter1"
              echo "$ISSUE_SUMMARY"
              echo "$delimiter1"
            } >> "$GITHUB_OUTPUT"
            delimiter2=$(openssl rand -hex 8)
            {
              echo "human_review_reason<<$delimiter2"
              echo "$HUMAN_REVIEW_REASON"
              echo "$delimiter2"
            } >> "$GITHUB_OUTPUT"
            delimiter3=$(openssl rand -hex 8)
            {
              echo "cause_explanation<<$delimiter3"
              echo "$CAUSE_EXPLANATION"
              echo "$delimiter3"
            } >> "$GITHUB_OUTPUT"
            delimiter4=$(openssl rand -hex 8)
            {
              echo "fix_explanation<<$delimiter4"
              echo "$FIX_EXPLANATION"
              echo "$delimiter4"
            } >> "$GITHUB_OUTPUT"
          }
          trap write_result EXIT

          # fail-closed: Claude 에이전트 스텝이 성공하지 않았으면(실패, 취소 등)
          # structured_output 파싱을 시도하지 않고 바로 안전한 값으로 처리
          if [ "$CLAUDE_OUTCOME" != "success" ]; then
            PARSED='{"hasIssues":false,"fixed":false,"needsHuman":true,"issueSummary":"","humanReviewReason":"Claude 에이전트 처리 자체가 실패함 - 자동 판단 불가, GitHub Issue는 생성하지 않고 사람 확인만 요청","causeExplanation":"","fixExplanation":""}'
          # fail-closed: structured_output이 비어있거나 스키마(8개 필드 모두 정확한 타입,
          # reviewContentRead/causeExplanation/fixExplanation 포함)를 만족하지 않으면
          # needsHuman=true, hasIssues=true로 안전하게 처리
          elif [ -n "$STRUCTURED_OUTPUT" ] && echo "$STRUCTURED_OUTPUT" | jq -e \
            '(.hasIssues | type) == "boolean" and (.fixed | type) == "boolean" and (.needsHuman | type) == "boolean" and (.reviewContentRead | type) == "boolean" and (.issueSummary | type) == "string" and (.humanReviewReason | type) == "string" and (.causeExplanation | type) == "string" and (.fixExplanation | type) == "string"' \
            > /dev/null 2>&1; then
            # fail-closed: 리뷰 봇의 코멘트/리뷰 내용을 Claude 에이전트가 실제로
            # 읽지 못했다면(gh CLI/네트워크 차단·실패 등) hasIssues가 무엇으로
            # 나왔든 무조건 사람 확인 필요로 강제 전환한다. reviewContentRead는
            # "확인 불가"와 "확인했더니 문제없음이 확실한 경우"를 구분하기 위한
            # 필드로, 이 분기는 "확인이 됐다고 확신할 수 없는 모든 경우"를 안전한
            # 쪽으로 보낸다 - hasIssues 판단 자체를 신뢰하지 않는다.
            if echo "$STRUCTURED_OUTPUT" | jq -e '.reviewContentRead == false' > /dev/null 2>&1; then
              PARSED=$(echo "$STRUCTURED_OUTPUT" | jq \
                '.needsHuman = true | .hasIssues = false | .humanReviewReason = "리뷰 봇 응답을 읽지 못해 확인이 필요합니다(네트워크/권한 차단 등)"')
            # fail-closed: 이슈가 있는데(hasIssues=true) 고치지도 않았고(fixed=false)
            # 사람 확인도 불필요(needsHuman=false)하다는 모순된 결과는 무효 처리.
            # hasIssues/fixed/issueSummary는 신뢰할 수 있으므로 그대로 보존하고
            # needsHuman과 humanReviewReason만 안전한 값으로 덮어쓴다.
            elif echo "$STRUCTURED_OUTPUT" | jq -e \
              '.hasIssues == true and .fixed == false and .needsHuman == false' \
              > /dev/null 2>&1; then
              PARSED=$(echo "$STRUCTURED_OUTPUT" | jq \
                '.needsHuman = true | .humanReviewReason = "검증 실패: 이슈가 있는데 해결되지 않았음에도 사람 확인이 불필요하다고 판단됨 - 안전을 위해 확인 필요로 전환"')
            else
              PARSED="$STRUCTURED_OUTPUT"
            fi
          else
            PARSED='{"hasIssues":true,"fixed":false,"needsHuman":true,"issueSummary":"","humanReviewReason":"자동 판단 실패, 확인 필요","causeExplanation":"","fixExplanation":""}'
          fi

          # jq 실패가 조용히 묻히지 않도록 각각 독립된 대입문으로 계산한다 -
          # echo 안에 인라인으로 넣으면 jq가 실패해도 바깥 echo는 항상 성공해
          # -e가 이를 감지하지 못한다
          NEEDS_HUMAN=$(echo "$PARSED" | jq -r '.needsHuman')
          HAS_ISSUES=$(echo "$PARSED" | jq -r '.hasIssues')
          ISSUE_SUMMARY=$(echo "$PARSED" | jq -r '.issueSummary')
          HUMAN_REVIEW_REASON=$(echo "$PARSED" | jq -r '.humanReviewReason')
          CAUSE_EXPLANATION=$(echo "$PARSED" | jq -r '.causeExplanation')
          FIX_EXPLANATION=$(echo "$PARSED" | jq -r '.fixExplanation')

      - name: 실제 git 상태 검증
        id: verify
        if: always() && steps.pr.outputs.is_trusted_bot == 'true' && steps.pr.outputs.is_fork == 'false' && steps.pr.outputs.is_placeholder == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          IS_REVIEW_SKIPPED: ${{ steps.pr.outputs.is_review_skipped }}
          PARSE_OUTCOME: ${{ steps.parse.outcome }}
          PARSE_NEEDS_HUMAN: ${{ steps.parse.outputs.needs_human }}
          PARSE_ISSUE_SUMMARY: ${{ steps.parse.outputs.issue_summary }}
          PARSE_HUMAN_REVIEW_REASON: ${{ steps.parse.outputs.human_review_reason }}
          PARSE_CAUSE_EXPLANATION: ${{ steps.parse.outputs.cause_explanation }}
          PARSE_FIX_EXPLANATION: ${{ steps.parse.outputs.fix_explanation }}
        run: |
          # Claude의 자기 보고(fixed:true 등)를 그대로 믿지 않고 실제 git 상태로 재검증.
          # 기본 bash -e 동작을 그대로 사용: 아래 명령 중 하나라도 실패하면 스크립트가
          # 즉시 종료되고, trap이 지금까지 설정된 기본값(fail-closed)을 그대로 출력한다.
          NEEDS_HUMAN=true
          ISSUE_SUMMARY="$PARSE_ISSUE_SUMMARY"
          HUMAN_REVIEW_REASON="git 상태 검증 스크립트가 완료되지 못함 - 확인 필요"
          DIRTY_FILES=""
          CLAUDE_MD_ONLY="false"
          # 원인 설명은 검증 결과와 무관하게(수정이 검증됐든 안됐든) Codex
          # 지적사항 자체에 대한 설명이라 항상 유효하므로 기본값으로 그대로
          # 이어받는다. 수정 내용 설명은 아래에서 실제 git 상태 검증을
          # 통과했을 때만(needs_human=false) 신뢰해 채운다 - Claude가
          # fixed:true라고 자기 보고했어도 실제로 push되지 않았거나 원격과
          # 어긋나면(MISMATCH) 고쳤다는 내용을 이슈에 그대로 옮기면 안 된다.
          CAUSE_EXPLANATION="$PARSE_CAUSE_EXPLANATION"
          FIX_EXPLANATION=""

          write_result() {
            echo "needs_human=$NEEDS_HUMAN" >> "$GITHUB_OUTPUT"
            echo "claude_md_only=$CLAUDE_MD_ONLY" >> "$GITHUB_OUTPUT"
            delimiter1=$(openssl rand -hex 8)
            {
              echo "issue_summary<<$delimiter1"
              echo "$ISSUE_SUMMARY"
              echo "$delimiter1"
            } >> "$GITHUB_OUTPUT"
            delimiter2=$(openssl rand -hex 8)
            {
              echo "human_review_reason<<$delimiter2"
              echo "$HUMAN_REVIEW_REASON"
              echo "$delimiter2"
            } >> "$GITHUB_OUTPUT"
            delimiter3=$(openssl rand -hex 8)
            {
              echo "dirty_files<<$delimiter3"
              echo "$DIRTY_FILES"
              echo "$delimiter3"
            } >> "$GITHUB_OUTPUT"
            delimiter4=$(openssl rand -hex 8)
            {
              echo "cause_explanation<<$delimiter4"
              echo "$CAUSE_EXPLANATION"
              echo "$delimiter4"
            } >> "$GITHUB_OUTPUT"
            delimiter5=$(openssl rand -hex 8)
            {
              echo "fix_explanation<<$delimiter5"
              echo "$FIX_EXPLANATION"
              echo "$delimiter5"
            } >> "$GITHUB_OUTPUT"
          }
          trap write_result EXIT

          # 리뷰 봇이 "리뷰를 실행하지 않았다/스킵했다"는 안내만 남긴 경우
          # (PR 정보 조회 스텝에서 감지) - 코드 검증 자체가 이뤄지지 않았으므로
          # git 상태를 볼 필요도 없이 곧바로 사람 확인 필요로 확정한다.
          # (CodeRabbit의 "star 10개 미만이라 리뷰 안 함" 안내를 "지적사항
          # 없음"으로 오인해 PR #49가 검증 없이 자동 merge된 사고 재발 방지)
          if [ "$IS_REVIEW_SKIPPED" = "true" ]; then
            NEEDS_HUMAN=true
            ISSUE_SUMMARY=""
            HUMAN_REVIEW_REASON="리뷰 봇이 리뷰를 실행하지 않았다는 취지의 안내(스킵/미실행/레이트리밋 등)만 남겼습니다. 실제 코드 검증이 이뤄지지 않았으므로 반드시 사람이 직접 확인해야 합니다."
            exit 0
          fi

          STATUS_OUTPUT=$(git status --porcelain)
          LOCAL_HEAD=$(git rev-parse HEAD)
          REMOTE_HEAD=$(gh pr view "$PR_NUMBER" --json headRefOid -q .headRefOid)

          # 변경된 파일 목록만 추출 (앞의 "XY " 상태 코드 3자 제거).
          # claude-code-action은 신뢰할 수 없는 컨텍스트에서 프롬프트 인젝션
          # 방지를 위해 CLAUDE.md 등 민감 경로를 origin/master 버전으로
          # 되돌려쓰는데, 이 PR이 CLAUDE.md 자체를 수정하는 경우 그 되돌려
          # 쓰기가 여기서 dirty 상태로 잡혀 알려진 오탐이 발생한다. dirty
          # 파일이 CLAUDE.md 단 하나뿐일 때만(다른 파일이 섞여 있으면 실제
          # 문제일 수 있으므로 이 판별을 적용하지 않는다) 아래 Slack 알림에
          # 원인 추정 문구를 붙이기 위한 표시만 남긴다 - needs_human 판정
          # 자체는 그대로 fail-closed 유지(이 판별로 알림을 끄지 않는다).
          DIRTY_FILES=$(echo "$STATUS_OUTPUT" | cut -c4-)
          CLAUDE_MD_ONLY="false"
          if [ "$DIRTY_FILES" = "CLAUDE.md" ]; then
            CLAUDE_MD_ONLY="true"
          fi

          MISMATCH="false"
          if [ -n "$STATUS_OUTPUT" ]; then
            MISMATCH="true"
          fi
          if [ "$LOCAL_HEAD" != "$REMOTE_HEAD" ]; then
            MISMATCH="true"
          fi

          # 모든 명령이 성공했을 때만 여기 도달한다. "문제없음" 경로는 파싱
          # 스텝이 성공(outcome=success)했고 needsHuman이 정확히 false로
          # 확인된 단 하나의 경우에만 허용한다 (fail-closed). 그 외 - 파싱
          # 스텝 자체가 실패했거나, 값이 비어있거나, true거나, 예상 못한 값인
          # 경우 - 는 전부 사람 확인 필요 경로로 보낸다.
          if [ "$MISMATCH" = "true" ]; then
            NEEDS_HUMAN=true
            FIX_EXPLANATION=""
            if [ -n "$PARSE_HUMAN_REVIEW_REASON" ]; then
              HUMAN_REVIEW_REASON="$(printf '%s\n\nClaude 자기 보고와 실제 git 상태 불일치 - 확인 필요' "$PARSE_HUMAN_REVIEW_REASON")"
            else
              HUMAN_REVIEW_REASON="Claude 자기 보고와 실제 git 상태 불일치 - 확인 필요"
            fi
          elif [ "$PARSE_OUTCOME" = "success" ] && [ "$PARSE_NEEDS_HUMAN" = "false" ]; then
            NEEDS_HUMAN=false
            HUMAN_REVIEW_REASON=""
            FIX_EXPLANATION="$PARSE_FIX_EXPLANATION"
          else
            NEEDS_HUMAN=true
            HUMAN_REVIEW_REASON="$PARSE_HUMAN_REVIEW_REASON"
            FIX_EXPLANATION=""
          fi
          ISSUE_SUMMARY="$PARSE_ISSUE_SUMMARY"
          CAUSE_EXPLANATION="$PARSE_CAUSE_EXPLANATION"

      - name: GitHub Issue 자동 등록
        id: github_issue
        if: always() && steps.pr.outputs.is_fork == 'false' && steps.pr.outputs.is_placeholder == 'false' && steps.parse.outcome == 'success' && steps.parse.outputs.has_issues == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REVIEW_ID: ${{ steps.pr.outputs.review_marker_id }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_URL: ${{ steps.pr.outputs.url }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          REVIEW_CONTENT: ${{ steps.pr.outputs.review_content_for_prompt }}
          ISSUE_SUMMARY: ${{ steps.verify.outputs.issue_summary }}
          CAUSE_EXPLANATION: ${{ steps.verify.outputs.cause_explanation }}
          FIX_EXPLANATION: ${{ steps.verify.outputs.fix_explanation }}
          NEEDS_HUMAN: ${{ steps.verify.outputs.needs_human }}
          HUMAN_REVIEW_REASON: ${{ steps.verify.outputs.human_review_reason }}
        run: |
          # 같은 리뷰/코멘트에 대해 워크플로우가 재실행되어도(또는 같은 리뷰
          # 제출에 딸린 pull_request_review와 pull_request_review_comment
          # 여러 건이 각각 별도 트리거되어도) 이슈가 중복 생성되지 않도록,
          # 이슈 본문에 심어둔 마커로 기존 이슈를 먼저 찾는다. REVIEW_ID는
          # "PR 정보 조회" 스텝에서 이벤트 타입과 무관하게 하나의 리뷰/코멘트를
          # 가리키는 값(리뷰 id 또는 코멘트 id)으로 이미 통일해뒀다.
          MARKER="<!-- worky-auto-issue:pr-${PR_NUMBER}-review-${REVIEW_ID} -->"

          # 같은 Codex 리뷰 1건이 pull_request_review와
          # pull_request_review_comment 두 이벤트로 각각 별도 워크플로우
          # 실행을 거의 동시에 트리거하는 경우가 실측으로 반복 확인됐다
          # (Issue #63/#64, #65/#66 - 매번 마커는 동일한데 이슈가 중복
          # 생성됨). 원래 --search "$MARKER in:body"는 GitHub Search API를
          # 쓰는데, 이 인덱스는 eventually-consistent라 방금 생성된
          # 이슈가 곧바로 검색 결과에 안 잡힐 수 있어 두 실행이 서로의
          # 이슈를 못 보고 각자 생성해버렸다. --search를 쓰지 않는 일반
          # 이슈 목록 조회(REST list, 검색 인덱스를 거치지 않고 기본
          # 데이터 저장소를 직접 읽음)는 즉시 일관성이 있으므로, 여기서는
          # 최근 이슈들을 가져와 마커를 로컬(jq)에서 찾는 방식으로
          # 바꿔 이 레이스를 근본적으로 줄인다. limit은 이 저장소의
          # 자동 등록 이슈 발생 속도를 감안해 여유 있게 잡았다 - 늘어나면
          # 값을 올려야 할 수 있다.
          ALL_ISSUES_JSON=$(gh issue list --repo yoobilee/worky --state all --json number,url,closed,body --limit 200)
          EXISTING=$(echo "$ALL_ISSUES_JSON" | jq --arg marker "$MARKER" '[.[] | select((.body // "") | contains($marker))] | .[0]')

          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            ISSUE_NUMBER=$(echo "$EXISTING" | jq -r '.number')
            ISSUE_URL=$(echo "$EXISTING" | jq -r '.url')
            # 이슈를 새로 만들지 않고 재사용하는 경로이므로, close 여부를
            # false로 하드코딩하지 않고 실제 GitHub 이슈 상태를 그대로
            # 반영한다 - 이전 실행이 이슈를 생성하고 close까지 마쳤는데
            # 후속 Supabase 기록 스텝만 실패해 워크플로우가 재실행되는
            # 경우, 재사용 분기를 타면서 이미 closed인 이슈를 false로
            # 잘못 보고하면 아래 Supabase 기록 스텝(steps.github_issue.
            # outputs.issue_closed를 쓰는 GH_ISSUE_CLOSED)에 그대로
            # 전달되어 실제로는 closed인데 status:open으로 잘못 기록되는
            # 문제가 있었다 (Issue #63 - Codex P2 지적).
            EXISTING_CLOSED=$(echo "$EXISTING" | jq -r '.closed')
            echo "이미 등록된 이슈를 재사용: $ISSUE_URL (closed=$EXISTING_CLOSED)"
            echo "issue_created=false" >> "$GITHUB_OUTPUT"

            # 위 수정(Issue #63)은 "실제 상태를 정확히 보고"하는 것까지만
            # 했을 뿐, 그 상태가 아직 "열림"인데 이번 실행의 재검증
            # 결과(NEEDS_HUMAN)로는 이미 close됐어야 하는 경우 close를
            # 다시 시도하지는 않았다. 시나리오: 이전 실행에서 자동 수정 후
            # gh issue close가 일시적으로 실패(경고만 남기고 계속 진행,
            # 아래 SHOULD_CLOSE 분기 참고) -> 같은 마커로 재실행되면 이
            # 재사용 분기를 타는데, NEEDS_HUMAN=false(자동 수정 완료)여도
            # close 재시도가 없어 이슈/Supabase 레코드가 계속 열려있고
            # Slack에도 "사람 확인 필요"처럼 잘못 안내됐다(Codex 지적,
            # Issue #67). "재사용된 이슈이지만 이번 실행 기준으로는 이미
            # 닫혔어야 함"을 감지해 close를 재시도한다.
            if [ "$EXISTING_CLOSED" = "false" ] && [ "$NEEDS_HUMAN" = "false" ]; then
              if gh issue close "$ISSUE_NUMBER" --repo yoobilee/worky; then
                echo "재사용된 이슈를 close 재시도로 닫음: $ISSUE_URL"
                echo "issue_closed=true" >> "$GITHUB_OUTPUT"
              else
                # fail-safe: close 재시도가 또 실패해도 워크플로우 전체를
                # 죽이지 않는다(continue-on-error도 이미 걸려있지만, 그와
                # 별개로 이 스텝 자체가 여기서 exit하지 않도록). 다음
                # 재실행에서 이 분기가 다시 시도된다.
                echo "::warning::재사용된 이슈의 close 재시도 실패 (이슈는 계속 열려있음: $ISSUE_URL) - 다음 재실행에서 다시 시도됨"
                echo "issue_closed=false" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "issue_closed=$EXISTING_CLOSED" >> "$GITHUB_OUTPUT"
            fi
          else
            # needs_human=='false'(자동 수정 + "실제 git 상태 검증" 스텝의
            # 검증까지 통과)인 경우에만, 이 시점에 "실제 수정 내용"/"검증"
            # 섹션까지 채운 완성된 본문으로 등록하고 바로 close한다.
            # needs_human=='true'인 경우는 아직 아무도(사람도) 고치지 않은
            # 시점이라 완성된 내용을 만들어낼 수 없으므로, 나중에 사람이
            # 직접 고친 뒤 채워 넣을 수 있게 빈 템플릿만 남기고 이슈는
            # 열어둔다. Claude의 자기 보고(fixed)가 아니라 git 상태까지
            # 재검증한 needs_human을 기준으로 판단하는 이유는 "실제 git
            # 상태 검증" 스텝과 동일 - 자기 보고만으로는 신뢰할 수 없다.
            if [ "$NEEDS_HUMAN" = "false" ]; then
              COMMIT_HASH=$(git log -1 --format=%H 2>/dev/null || echo "")
              BODY_TEXT=$(printf '%s\n\n**발견: Codex 자동 리뷰 (PR #%s)**\n자동 검증 파이프라인(claude-review-response.yml)이 Codex의 리뷰를 확인하고 자동으로 등록한 이슈입니다.\n\n**원인 / Codex 지적 내용**\n%s\n\n%s\n\n**실제 수정 내용**\n%s\n\n수정 커밋: `%s`\n반영된 PR: %s\n\n**검증**\n자동 파이프라인이 실제 git 상태 검증(커밋이 실제로 push됐는지, 원격 브랜치와 일치하는지 확인)을 통과했습니다. 이 PR의 GitHub Actions 빌드 체크(CI) 통과 후 자동 merge됩니다.\n\n자동으로 수정 및 검증이 완료되어 즉시 close합니다.' \
                "$MARKER" "$PR_NUMBER" "$REVIEW_CONTENT" "$CAUSE_EXPLANATION" "$FIX_EXPLANATION" "$COMMIT_HASH" "$PR_URL")
              SHOULD_CLOSE="true"
            else
              REASON_TEXT="${HUMAN_REVIEW_REASON:-사람 확인이 필요합니다}"
              BODY_TEXT=$(printf '%s\n\n**발견: Codex 자동 리뷰 (PR #%s)**\n자동 검증 파이프라인(claude-review-response.yml)이 Codex의 리뷰를 확인했으나 자동으로 해결할 수 없어 사람 확인이 필요한 상태로 등록되었습니다.\n\n**사람 확인이 필요한 이유**\n%s\n\n**원인 / Codex 지적 내용**\n%s\n\n%s\n\n**실제 수정 내용**\n미해결 — 사람 확인 대기 중\n\n**검증**\n이슈 발견 시점이라 아직 해당 없음\n\n---\n이 이슈는 나중에 사람이 해결 후 close할 때, 아래 템플릿에 맞춰 위 두 섹션을 채워주세요:\n\n**실제 수정 내용**\n(무엇을, 어떻게 고쳤는지 - 수정 후 코드 스니펫 포함)\n\n수정 커밋: `<커밋 해시>`\n반영된 PR: <PR 링크>\n\n**검증**\n(bash -n / npm run build / 재현 테스트 등 어떻게 검증했는지와 결과)' \
                "$MARKER" "$PR_NUMBER" "$REASON_TEXT" "$REVIEW_CONTENT" "$CAUSE_EXPLANATION")
              SHOULD_CLOSE="false"
            fi

            ISSUE_URL=$(gh issue create --repo yoobilee/worky \
              --title "$PR_TITLE" \
              --body "$BODY_TEXT")

            if [ -z "$ISSUE_URL" ]; then
              echo "::error::GitHub Issue 생성 실패 (URL을 받지 못함)"
              exit 1
            fi

            ISSUE_NUMBER=$(echo "$ISSUE_URL" | grep -oE '[0-9]+$')
            echo "GitHub Issue 생성됨: $ISSUE_URL"
            echo "issue_created=true" >> "$GITHUB_OUTPUT"

            if [ "$SHOULD_CLOSE" = "true" ]; then
              if gh issue close "$ISSUE_NUMBER" --repo yoobilee/worky; then
                echo "issue_closed=true" >> "$GITHUB_OUTPUT"
              else
                echo "::warning::이슈 자동 close 실패 (이슈는 이미 생성됨: $ISSUE_URL)"
                echo "issue_closed=false" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "issue_closed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

          echo "issue_url=$ISSUE_URL" >> "$GITHUB_OUTPUT"
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Supabase issues 테이블 기록
        if: always() && steps.pr.outputs.is_fork == 'false' && steps.pr.outputs.is_placeholder == 'false' && steps.parse.outcome == 'success' && steps.parse.outputs.has_issues == 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          ISSUE_SUMMARY: ${{ steps.verify.outputs.issue_summary }}
          CAUSE_EXPLANATION: ${{ steps.verify.outputs.cause_explanation }}
          FIX_EXPLANATION: ${{ steps.verify.outputs.fix_explanation }}
          GH_ISSUE_NUMBER: ${{ steps.github_issue.outputs.issue_number }}
          GH_ISSUE_URL: ${{ steps.github_issue.outputs.issue_url }}
          GH_ISSUE_CLOSED: ${{ steps.github_issue.outputs.issue_closed }}
        run: |
          # Worky 자체 이슈 - 소유자 계정 고정
          USER_ID="5a2804b4-4ecb-435c-b039-0cbc6e57837c"

          if [ -z "$GH_ISSUE_NUMBER" ]; then
            echo "GitHub Issue 번호가 없어(이전 스텝 실패 등) Supabase 기록을 건너뜁니다."
            exit 0
          fi

          # 마이그레이션 없이 애플리케이션 레벨에서 중복 삽입을 막기 위해
          # 동일 github_issue_number 레코드가 이미 있는지 먼저 확인한다
          EXISTING=$(curl -s -w "\n%{http_code}" -G "${SUPABASE_URL}/rest/v1/issues" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --data-urlencode "github_issue_number=eq.${GH_ISSUE_NUMBER}" \
            --data-urlencode "select=id")

          EXISTING_HTTP_CODE=$(echo "$EXISTING" | tail -1)
          EXISTING_BODY=$(echo "$EXISTING" | sed '$d')

          if [ "$EXISTING_HTTP_CODE" -ge 400 ]; then
            echo "::error::Supabase issues 중복 확인 실패 (HTTP $EXISTING_HTTP_CODE): $EXISTING_BODY"
            exit 1
          fi

          EXISTING_COUNT=$(echo "$EXISTING_BODY" | jq 'length')
          if [ "$EXISTING_COUNT" -gt 0 ]; then
            echo "이미 Supabase에 기록된 이슈(#$GH_ISSUE_NUMBER) - 중복 삽입 건너뜀"
            exit 0
          fi

          # GitHub Issue 본문과 내용을 맞추기 위해(이슈 정리 페이지 등에서
          # 나중에 이 레코드만 봐도 맥락을 알 수 있도록) 짧은 요약 대신
          # 원인/수정 내용까지 포함한 설명을 저장한다. FIX_EXPLANATION은
          # 자동 수정이 검증까지 완료된 경우에만 채워지므로(steps.verify에서
          # 이미 fail-closed 처리됨), 비어있으면 아직 미해결 상태라는
          # 표시를 그대로 남긴다.
          DESCRIPTION_TEXT=$(printf '%s\n\n[원인]\n%s\n\n[수정 내용]\n%s' \
            "$ISSUE_SUMMARY" "$CAUSE_EXPLANATION" "${FIX_EXPLANATION:-미해결 - 사람 확인 대기 중}")

          # 자동 수정 후 즉시 close된 경우(GH_ISSUE_CLOSED=true)까지 status를
          # "open"으로 고정하면 GitHub과 Supabase 상태가 어긋나므로 맞춰준다.
          # 이후 사람이 GitHub에서 수동으로 close/reopen하면
          # /api/webhooks/github, /api/issues/sync가 이 status를 계속
          # 동기화한다.
          if [ "$GH_ISSUE_CLOSED" = "true" ]; then
            STATUS_VALUE="closed"
          else
            STATUS_VALUE="open"
          fi

          PAYLOAD=$(jq -n \
            --arg user_id "$USER_ID" \
            --arg title "$PR_TITLE" \
            --arg description "$DESCRIPTION_TEXT" \
            --arg repo "yoobilee/worky" \
            --argjson github_issue_number "$GH_ISSUE_NUMBER" \
            --arg github_issue_url "$GH_ISSUE_URL" \
            --arg status "$STATUS_VALUE" \
            '{
              user_id: $user_id,
              source: "auto-pipeline",
              title: $title,
              description: $description,
              repo: $repo,
              github_issue_number: $github_issue_number,
              github_issue_url: (if $github_issue_url == "" then null else $github_issue_url end),
              status: $status
            }')

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${SUPABASE_URL}/rest/v1/issues" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "$PAYLOAD")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Supabase issues 기록 실패 (HTTP $HTTP_CODE): $BODY"
            exit 1
          fi
          echo "Supabase issues 테이블 기록 완료"

      - name: 이슈 채널 알림 (결함 있었던 경우)
        # 예전에는 issue_created=='true'(이번 실행에서 새로 만든 경우)에만
        # 알림을 보내 재사용 시 중복 알림을 막았는데, 이 방식은 "이슈 생성
        # 성공"과 "알림 전송 성공"을 하나의 플래그로 뭉뚱그려 Slack 전송이
        # 실패하면(일시적 장애 등) 잡이 실패로 끝나고, 재실행 시 마커로
        # 기존 이슈를 재사용(issue_created=false)하게 되면서 알림이 영구히
        # 스킵되는 문제가 있었다(Codex 지적, Issue #65). 아래에서
        # review_marker_id 기준 라벨로 "알림 전송 성공" 자체를 별도 추적해
        # (review-timeout-watchdog.yml, "특이사항 알림" 스텝과 동일 패턴:
        # Slack 전송이 성공한 뒤에만 라벨을 붙임) 이 스텝의 재시도 여부를
        # 그 라벨로만 판단하도록 분리했다. issue_created/issue_closed
        # 출력이나 Supabase 기록·특이사항 알림·자동 merge 등 다른 스텝의
        # 판단 기준은 전혀 건드리지 않는다.
        if: always() && steps.github_issue.outcome == 'success' && steps.github_issue.outputs.issue_url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REVIEW_MARKER_ID: ${{ steps.pr.outputs.review_marker_id }}
          SLACK_ISSUES_WEBHOOK_URL: ${{ secrets.SLACK_ISSUES_WEBHOOK_URL }}
          ISSUE_URL: ${{ steps.github_issue.outputs.issue_url }}
          ISSUE_NUMBER: ${{ steps.github_issue.outputs.issue_number }}
          ISSUE_CLOSED: ${{ steps.github_issue.outputs.issue_closed }}
          SUMMARY: ${{ steps.verify.outputs.issue_summary }}
        run: |
          NOTIFY_LABEL="issue-notified:${REVIEW_MARKER_ID:-unknown}"
          EXISTING_LABELS=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name' 2>/dev/null || echo "")
          if echo "$EXISTING_LABELS" | grep -qxF "$NOTIFY_LABEL"; then
            echo "이미 이 리뷰/코멘트(${REVIEW_MARKER_ID:-unknown})에 대해 이슈 등록 알림을 성공적으로 보냈음 - 중복 알림 스킵"
            exit 0
          fi

          if [ "$ISSUE_CLOSED" = "true" ]; then
            STATUS_LABEL="등록됨 (자동 수정 완료 - 즉시 close)"
          else
            STATUS_LABEL="등록됨 (사람 확인 필요)"
          fi
          jq -n --arg issue_url "$ISSUE_URL" \
                --arg issue_number "$ISSUE_NUMBER" \
                --arg status_label "$STATUS_LABEL" \
                --arg summary "$SUMMARY" \
            '{text: ("🐞 <" + $issue_url + "|GitHub Issue #" + $issue_number + "> " + $status_label + "\n\n" + $summary)}' | \
            curl -sf -X POST -H "Content-Type: application/json" -d @- "$SLACK_ISSUES_WEBHOOK_URL"

          # bash -e 기본 동작상 위 curl -sf가 실패하면 여기 도달하지 못하고
          # 스텝이 즉시 실패 종료된다 - 라벨은 Slack 전송이 실제로 성공한
          # 뒤에만 붙어야 다음 재시도에서 정확히 "아직 알림 못 보냄"으로
          # 판단할 수 있다.
          gh label create "$NOTIFY_LABEL" --repo "$REPO" --color "2EB67D" --force >/dev/null 2>&1 || true
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "$NOTIFY_LABEL" || true

      - name: 특이사항 알림 (사람 판단 필요한 경우)
        # steps.verify는 is_trusted_bot=='false'일 때 통째로 스킵되어
        # outputs.needs_human이 빈 문자열이 되므로(!= 'false'가 참이 되어
        # 버림), is_trusted_bot을 여기서도 명시적으로 확인해야 다른 봇의
        # 코멘트(vercel[bot] 배포 알림 등)에 잘못 반응하지 않는다
        if: always() && steps.pr.outputs.is_trusted_bot == 'true' && steps.pr.outputs.is_fork == 'false' && steps.pr.outputs.is_placeholder == 'false' && steps.verify.outputs.needs_human != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SLACK_EXCEPTION_WEBHOOK_URL: ${{ secrets.SLACK_EXCEPTION_WEBHOOK_URL }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_URL: ${{ steps.pr.outputs.url }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          REVIEW_MARKER_ID: ${{ steps.pr.outputs.review_marker_id }}
          SUMMARY: ${{ steps.verify.outputs.human_review_reason }}
          CLAUDE_MD_ONLY: ${{ steps.verify.outputs.claude_md_only }}
          DIRTY_FILES: ${{ steps.verify.outputs.dirty_files }}
        run: |
          # 같은 리뷰 제출에 pull_request_review와 pull_request_review_comment가
          # (인라인 코멘트 개수만큼) 여러 건 각각 별도로 트리거될 수 있어,
          # review_marker_id 기준으로 라벨을 남겨 같은 리뷰/코멘트에 대해
          # 이미 알림을 보냈으면 다시 보내지 않는다 (review-timeout-watchdog.yml의
          # SHA 라벨 방식과 동일한 패턴). 라벨 확인/부착이 실패해도(권한 등)
          # 알림 자체는 fail-closed로 그대로 보낸다 - 중복 방지 실패가
          # "알림을 아예 안 보냄"으로 이어지면 안 되기 때문이다.
          NOTIFY_LABEL="needs-human:${REVIEW_MARKER_ID:-unknown}"
          EXISTING_LABELS=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name' 2>/dev/null || echo "")
          if echo "$EXISTING_LABELS" | grep -qxF "$NOTIFY_LABEL"; then
            echo "이미 이 리뷰/코멘트(${REVIEW_MARKER_ID:-unknown})에 대해 특이사항 알림을 보냈음 - 중복 알림 스킵"
            exit 0
          fi

          # dirty 파일이 CLAUDE.md 하나뿐이면 claude-code-action의 보안
          # 되돌려쓰기로 인한 알려진 오탐일 가능성이 높다는 안내를 덧붙인다
          # (CLAUDE.md 참고). needs_human 판정 자체는 그대로 fail-closed로
          # 유지되고, 이 안내는 사람이 더 빨리 원인을 파악하도록 돕는
          # 참고 정보일 뿐이다.
          if [ "$CLAUDE_MD_ONLY" = "true" ]; then
            MESSAGE_BODY="$(printf '%s\n\n⚠️ CLAUDE.md 관련 변경 감지 - claude-code-action의 보안 되돌려쓰기로 인한 알려진 오탐일 가능성이 높습니다. 실제 코드 문제가 아닐 수 있으니 아래 git status 변경 파일 목록을 확인해주세요.\n\n변경된 파일:\n%s' "$SUMMARY" "$DIRTY_FILES")"
          else
            MESSAGE_BODY="$SUMMARY"
          fi

          jq -n --arg url "$PR_URL" \
                --arg title "$PR_TITLE" \
                --arg summary "$MESSAGE_BODY" \
            '{text: ("⚠️ *확인 필요* <" + $url + "|" + $title + ">\n" + $summary)}' | \
            curl -sf -X POST -H "Content-Type: application/json" -d @- "$SLACK_EXCEPTION_WEBHOOK_URL"

          gh label create "$NOTIFY_LABEL" --repo "$REPO" --color "F9A825" --force >/dev/null 2>&1 || true
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "$NOTIFY_LABEL" || true

      - name: 자동 merge 요청 (사람 판단 불필요한 경우만)
        if: steps.pr.outputs.is_fork == 'false' && steps.pr.outputs.is_placeholder == 'false' && steps.verify.outputs.needs_human == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          ISSUE_SUMMARY: ${{ steps.verify.outputs.issue_summary }}
        run: |
          # heredoc/이스케이프 없이 파일로 넘겨 특수문자·줄바꿈 이슈를 피한다
          BODY_TEXT="${ISSUE_SUMMARY:-특이사항 없음}"
          {
            echo "## 검증 결과"
            echo
            echo "$BODY_TEXT"
            echo
            echo "## 처리 방식"
            echo "Codex 자동 리뷰 + Claude Code 에이전트 자동 검증"
          } > /tmp/merge_body.md
          gh pr merge --auto --squash --subject "$PR_TITLE" --body-file /tmp/merge_body.md "$PR_NUMBER"
