name: Claude Review Response
on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

jobs:
  respond:
    if: >
      (github.event_name == 'pull_request_review' && github.event.review.user.login == 'coderabbitai[bot]' &&
       github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name) ||
      (github.event_name == 'issue_comment' && github.event.comment.user.login == 'coderabbitai[bot]' && github.event.issue.pull_request)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: PR 정보 조회
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER_REVIEW: ${{ github.event.pull_request.number }}
          PR_REF_REVIEW: ${{ github.event.pull_request.head.ref }}
          PR_URL_REVIEW: ${{ github.event.pull_request.html_url }}
          PR_TITLE_REVIEW: ${{ github.event.pull_request.title }}
          PR_HEAD_REPO_REVIEW: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_REPO_REVIEW: ${{ github.event.pull_request.base.repo.full_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          if [ "$EVENT_NAME" = "pull_request_review" ]; then
            NUMBER="$PR_NUMBER_REVIEW"
            REF="$PR_REF_REVIEW"
            URL="$PR_URL_REVIEW"
            TITLE="$PR_TITLE_REVIEW"
            if [ "$PR_HEAD_REPO_REVIEW" = "$PR_BASE_REPO_REVIEW" ]; then
              IS_FORK="false"
            else
              IS_FORK="true"
            fi
          else
            NUMBER="$ISSUE_NUMBER"
            REF=$(gh pr view "$NUMBER" --repo "$REPO" --json headRefName -q .headRefName)
            URL="$ISSUE_URL"
            TITLE="$ISSUE_TITLE"
            IS_FORK=$(gh pr view "$NUMBER" --repo "$REPO" --json isCrossRepository -q .isCrossRepository)
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "is_fork=$IS_FORK" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.pr.outputs.is_fork != 'true'
        with:
          ref: ${{ steps.pr.outputs.ref }}
          persist-credentials: false

      - name: Claude Code 리뷰 처리
        id: claude
        if: steps.pr.outputs.is_fork != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "coderabbitai[bot]"
          claude_args: |
            --max-turns 10
            --json-schema '{"type":"object","properties":{"hasIssues":{"type":"boolean"},"fixed":{"type":"boolean"},"needsHuman":{"type":"boolean"},"summary":{"type":"string"}},"required":["hasIssues","fixed","needsHuman","summary"]}'
          prompt: |
            이 PR에 CodeRabbit이 남긴 리뷰를 확인해줘:
            ${{ github.event_name == 'pull_request_review' && github.event.review.body || github.event.comment.body }}

            아래 원칙에 따라 처리해:
            1. CodeRabbit이 지적한 문제가 없으면(승인/문제없음) 그대로 종료
            2. 안전하고 확실하게 고칠 수 있는 문제(타입 에러, 명백한 버그,
               스타일 문제 등)면 직접 코드를 수정하고 커밋해
            3. 아래에 해당하면 절대 코드를 수정하지 말고 "사람 판단 필요"로만 분류:
               - Supabase 마이그레이션 파일(supabase/migrations/) 관련 지적
               - 환경변수, API 키, 인증/보안 관련 지적
               - GitHub Actions 워크플로우 파일(.github/workflows/) 자체 관련 지적
               - 여러 가지 해석이 가능하거나 설계 판단이 필요한 지적
            4. 마지막에 지정된 JSON 스키마(hasIssues, fixed, needsHuman, summary
               4개 필드 모두 필수)를 정확히 지켜서 결과를 출력해

      - name: 결과 파싱 및 분기
        id: parse
        if: steps.pr.outputs.is_fork != 'true'
        env:
          STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
        run: |
          # fail-closed: structured_output이 비어있거나 스키마(4개 필드 모두 정확한 타입)를
          # 만족하지 않으면 needsHuman=true, hasIssues=true로 안전하게 처리
          if [ -n "$STRUCTURED_OUTPUT" ] && echo "$STRUCTURED_OUTPUT" | jq -e \
            '(.hasIssues | type) == "boolean" and (.fixed | type) == "boolean" and (.needsHuman | type) == "boolean" and (.summary | type) == "string"' \
            > /dev/null 2>&1; then
            PARSED="$STRUCTURED_OUTPUT"
          else
            PARSED='{"hasIssues":true,"fixed":false,"needsHuman":true,"summary":"자동 판단 실패, 확인 필요"}'
          fi
          echo "needs_human=$(echo "$PARSED" | jq -r '.needsHuman')" >> "$GITHUB_OUTPUT"
          echo "has_issues=$(echo "$PARSED" | jq -r '.hasIssues')" >> "$GITHUB_OUTPUT"
          delimiter=$(openssl rand -hex 8)
          {
            echo "summary<<$delimiter"
            echo "$PARSED" | jq -r '.summary'
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: 이슈 채널 알림 (결함 있었던 경우)
        if: steps.pr.outputs.is_fork != 'true' && steps.parse.outputs.has_issues == 'true'
        env:
          SLACK_ISSUES_WEBHOOK_URL: ${{ secrets.SLACK_ISSUES_WEBHOOK_URL }}
          PR_URL: ${{ steps.pr.outputs.url }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          SUMMARY: ${{ steps.parse.outputs.summary }}
        run: |
          jq -n --arg url "$PR_URL" \
                --arg title "$PR_TITLE" \
                --arg summary "$SUMMARY" \
            '{text: ("*<" + $url + "|" + $title + ">*\n" + $summary)}' | \
            curl -sf -X POST -H "Content-Type: application/json" -d @- "$SLACK_ISSUES_WEBHOOK_URL"

      - name: 특이사항 알림 (사람 판단 필요한 경우)
        if: steps.pr.outputs.is_fork != 'true' && steps.parse.outputs.needs_human == 'true'
        env:
          SLACK_EXCEPTION_WEBHOOK_URL: ${{ secrets.SLACK_EXCEPTION_WEBHOOK_URL }}
          PR_URL: ${{ steps.pr.outputs.url }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          SUMMARY: ${{ steps.parse.outputs.summary }}
        run: |
          jq -n --arg url "$PR_URL" \
                --arg title "$PR_TITLE" \
                --arg summary "$SUMMARY" \
            '{text: ("⚠️ *확인 필요* <" + $url + "|" + $title + ">\n" + $summary)}' | \
            curl -sf -X POST -H "Content-Type: application/json" -d @- "$SLACK_EXCEPTION_WEBHOOK_URL"

      - name: 자동 merge 요청 (사람 판단 불필요한 경우만)
        if: steps.pr.outputs.is_fork != 'true' && steps.parse.outputs.needs_human == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: gh pr merge --auto --squash "$PR_NUMBER"
