name: Claude Review Response
on:
  pull_request_review:
    types: [submitted]

jobs:
  respond:
    if: github.event.review.user.login == 'coderabbitai[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Claude Code 리뷰 처리
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 10
          prompt: |
            이 PR에 CodeRabbit이 남긴 리뷰를 확인해줘:
            ${{ github.event.review.body }}

            아래 원칙에 따라 처리해:
            1. CodeRabbit이 지적한 문제가 없으면(승인/문제없음) 그대로 종료
            2. 안전하고 확실하게 고칠 수 있는 문제(타입 에러, 명백한 버그,
               스타일 문제 등)면 직접 코드를 수정하고 커밋해
            3. 아래에 해당하면 절대 코드를 수정하지 말고 "사람 판단 필요"로만 분류:
               - Supabase 마이그레이션 파일(supabase/migrations/) 관련 지적
               - 환경변수, API 키, 인증/보안 관련 지적
               - GitHub Actions 워크플로우 파일(.github/workflows/) 자체 관련 지적
               - 여러 가지 해석이 가능하거나 설계 판단이 필요한 지적
            4. 마지막에 다음 JSON 형식으로만 결과를 출력해 (다른 텍스트 없이):
               {"hasIssues": true/false, "fixed": true/false, "needsHuman": true/false,
                "summary": "한국어로 무슨 일이 있었는지 2-3문장 요약"}

      - name: 결과 파싱 및 분기
        id: parse
        env:
          CLAUDE_RESULT: ${{ steps.claude.outputs.result }}
        run: |
          if echo "$CLAUDE_RESULT" | jq . > /dev/null 2>&1; then
            PARSED="$CLAUDE_RESULT"
          else
            PARSED='{"hasIssues":false,"fixed":false,"needsHuman":true,"summary":"결과 파싱 실패, 수동 확인 필요"}'
          fi
          echo "needs_human=$(echo "$PARSED" | jq -r '.needsHuman // true')" >> "$GITHUB_OUTPUT"
          echo "has_issues=$(echo "$PARSED" | jq -r '.hasIssues // false')" >> "$GITHUB_OUTPUT"
          echo "summary=$(echo "$PARSED" | jq -r '.summary // "요약 없음"')" >> "$GITHUB_OUTPUT"

      - name: 이슈 채널 알림 (결함 있었던 경우)
        if: steps.parse.outputs.has_issues == 'true'
        env:
          SLACK_ISSUES_WEBHOOK_URL: ${{ secrets.SLACK_ISSUES_WEBHOOK_URL }}
        run: |
          jq -n --arg url "${{ github.event.pull_request.html_url }}" \
                --arg title "${{ github.event.pull_request.title }}" \
                --arg summary "${{ steps.parse.outputs.summary }}" \
            '{text: ("*<" + $url + "|" + $title + ">*\n" + $summary)}' | \
            curl -sf -X POST -H "Content-Type: application/json" -d @- "$SLACK_ISSUES_WEBHOOK_URL"

      - name: 특이사항 알림 (사람 판단 필요한 경우)
        if: steps.parse.outputs.needs_human == 'true'
        env:
          SLACK_EXCEPTION_WEBHOOK_URL: ${{ secrets.SLACK_EXCEPTION_WEBHOOK_URL }}
        run: |
          jq -n --arg url "${{ github.event.pull_request.html_url }}" \
                --arg title "${{ github.event.pull_request.title }}" \
                --arg summary "${{ steps.parse.outputs.summary }}" \
            '{text: ("⚠️ *확인 필요* <" + $url + "|" + $title + ">\n" + $summary)}' | \
            curl -sf -X POST -H "Content-Type: application/json" -d @- "$SLACK_EXCEPTION_WEBHOOK_URL"

      - name: 자동 merge 요청 (사람 판단 불필요한 경우만)
        if: steps.parse.outputs.needs_human != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "${{ github.event.pull_request.number }}"
